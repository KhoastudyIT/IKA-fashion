<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#E8D48B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Outer diamond frame -->
  <polygon points="32,2 62,32 32,62 2,32" fill="none" stroke="url(#iconGold)" stroke-width="1.5"/>
  
  <!-- Inner diamond -->
  <polygon points="32,8 56,32 32,56 8,32" fill="#2C2C2C"/>
  
  <!-- IKA text centered -->
  <text x="32" y="38" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-size="16" font-weight="500" letter-spacing="2" fill="#FFFFFF">IKA</text>
  
  <!-- Small decorative lines -->
  <line x1="18" y1="32" x2="23" y2="32" stroke="url(#iconGold)" stroke-width="0.6"/>
  <line x1="41" y1="32" x2="46" y2="32" stroke="url(#iconGold)" stroke-width="0.6"/>
</svg>
